<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img"><title>Autodiary</title><rect width="1200" height="320" rx="20" fill="#0e1929"/><g font-family="Arial, sans-serif"><text x="44" y="48" fill="#67e8c3" font-size="15" letter-spacing="3">PERSONAL AI PLATFORM</text><text x="44" y="112" fill="#f3f7fc" font-size="43" font-weight="700">Autodiary</text><text x="44" y="157" fill="#b7c6d9" font-size="19">Знания, обучение, планы и исследования с опорой на личный опыт</text><rect x="44" y="201" width="265" height="65" rx="12" fill="#19283a" stroke="#36465b"/><text x="62" y="241" fill="#edf3fa" font-size="17">Вопрос или задача</text><rect x="325" y="201" width="265" height="65" rx="12" fill="#19283a" stroke="#36465b"/><text x="343" y="241" fill="#edf3fa" font-size="17">Данные, знания, опыт</text><rect x="606" y="201" width="265" height="65" rx="12" fill="#19283a" stroke="#36465b"/><text x="624" y="241" fill="#edf3fa" font-size="17">План, урок, исследование</text><rect x="887" y="201" width="265" height="65" rx="12" fill="#19283a" stroke="#36465b"/><text x="905" y="241" fill="#edf3fa" font-size="17">Применение и отклик</text><path d="M57 289 H1144" stroke="#67e8c3" stroke-width="3" opacity=".7"/></g></svg>
